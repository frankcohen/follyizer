[project]
name = "follyizer"
version = "0.1.3"
description = "Meshtastic remote control and status bridge for Falcon Player"
requires-python = ">=3.11"
dependencies = [
  "meshtastic>=2.6,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
